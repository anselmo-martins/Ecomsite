<! DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Ecommerce </title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://use.fontawesome.com/releases/v5.15.4/css/all.css">
</head>

<body>
    <section id="header">
        <a href="index.html"><img src="resources/images/logSai-removebg-preview.png" class="logo" alt="Logo"></a>
            <div>
                <ul id="navbar">
                    <li><a href="index.html">Home</a></li>
                    <li><a href="products.html">Products</a></li>
                    <li><a href="cart.html"><img src="resources/icons/cart.png" alt="Cart"></a></li>
                </ul>
            </div>
        </section>
    
    <section id="hero">
        <h4>Summer special!</h4>
        <h2>Super Deals</h2>
        <h1>On All Products</h1>
        <p>Save more with special coupons with up to 70% OFF!!</p>
        <button>Shop Now</button>
    </section>

    <section id="feature" class="section-p1">
        <div class="f-box">
            <img class="featureImg" src="resources/Features/freeShipping.jpg" alt="Free shipping Icon">
            <h6>Free Shipping</h6>
        </div>
        <div class="f-box">
            <img class="featureImg" src="resources/Features/onlineShop.png" alt="Online Shopping Icon">
            <h6>Online Shopping</h6>
        </div>
        <div class="f-box">
            <img class="featureImg" src="resources/Features/saveMoney.png" alt="Save Money Icon">
            <h6>Save Money</h6>
        </div>
        <div class="f-box">
            <img class="featureImg" src="resources/Features/support.png" alt="24 Hour Support Icon">
            <h6>24/7 Support</h6>
        </div>
    </section>

    <section id="product1" class="section-p1">
        <h2>Featured Products</h2>
        <p>Our Best Tech Collection</p>
        <div class="p-container">
           <div class="pro">
            <img src="resources/products/buds.png" alt="buds product">
            <div class="des">
                <span>JBL</span>
                <h5>Wireless Earbuds</h5>
                <div class="star">
                    <i class="fas fa-star"></i>
                    <i class="fas fa-star"></i>
                    <i class="fas fa-star"></i>
                    <i class="fas fa-star"></i>
                    <i class="fas fa-star"></i>
                </div>
                <h4>N$230</h4>
                <a href="#" class="cart-icon"><i class="fas fa-shopping-cart"></i></a>
            </div>
           </div>
        </div>
      
    </section>


<script src="script.js"></script>
</body>

</html>
